<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>셀러 등록 · Digging Market</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <div class="top-nav">
    <a href="/" class="back">←</a>
    <h2 class="page-title">상품 등록</h2>
  </div>

  <div class="content">
    <div id="seller-badge" style="background:#fff; border:0.5px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:16px; font-size:13px; color:var(--muted);">
      확인 중...
    </div>

    <div id="edit-seller-form" style="display:none; background:#fff; border:0.5px solid var(--border); border-radius:var(--radius-sm); padding:14px; margin-bottom:16px;">
      <label>셀러 이름 / 부스명</label>
      <input type="text" id="edit-seller-name" />

      <label>연락처 링크 (인스타 등)</label>
      <input type="text" id="edit-contact-link" placeholder="예: instagram.com/아이디" />

      <p style="font-size:11px; color:var(--muted); margin: -4px 0 12px;">부스 번호는 운영진만 변경할 수 있어요.</p>

      <div style="display:flex; gap:8px;">
        <button type="button" class="btn-outline" style="flex:1;" onclick="toggleEditForm(false)">취소</button>
        <button type="button" class="btn-primary" style="flex:1;" onclick="saveSellerInfo()">저장</button>
      </div>
    </div>

    <form id="sell-form" style="display:none;">
      <div class="upload-box" id="upload-box">
        <div class="placeholder" id="upload-placeholder">
          📷<br />사진 촬영 / 업로드
        </div>
        <img id="preview-img" style="display:none" />
      </div>
      <input type="file" id="image-input" accept="image/*" capture="environment" style="display:none" />

      <div class="ai-badge" id="ai-badge" style="display:none">
        <span id="ai-badge-text">✨ AI가 분석 중...</span>
      </div>

      <label>카테고리</label>
      <div class="tag-row" id="category-tags" style="margin-bottom:12px;">
        <span class="tag selectable" data-value="LP">LP</span>
        <span class="tag selectable" data-value="카세트">카세트</span>
        <span class="tag selectable" data-value="의류">의류</span>
        <span class="tag selectable" data-value="기타">기타</span>
      </div>

      <label>상품명</label>
      <input type="text" id="title" placeholder="예: 비틀즈 Abbey Road" required />

      <label>설명</label>
      <textarea id="description" placeholder="상태, 특징 등을 적어주세요"></textarea>

      <label>가격 (원)</label>
      <input type="number" id="price" placeholder="예: 15000" required />

      <button type="submit" class="btn-primary" style="margin-top:8px;">등록하기</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');

const uploadBox = document.getElementById('upload-box');
const imageInput = document.getElementById('image-input');
const previewImg = document.getElementById('preview-img');
const uploadPlaceholder = document.getElementById('upload-placeholder');
const aiBadge = document.getElementById('ai-badge');
const aiBadgeText = document.getElementById('ai-badge-text');
const categoryTags = document.querySelectorAll('#category-tags .tag');
let selectedCategory = null;
let selectedFile = null;

let currentSeller = null;

async function verifySeller() {
  const badge = document.getElementById('seller-badge');
  if (!token) {
    badge.textContent = '⚠️ 접근 권한이 없어요. 셀러용 QR코드로 다시 접속해주세요.';
    return;
  }
  try {
    const res = await fetch(`/api/sellers/verify?token=${encodeURIComponent(token)}`);
    if (!res.ok) throw new Error('invalid token');
    currentSeller = await res.json();
    renderSellerBadge();
    document.getElementById('sell-form').style.display = 'block';
  } catch (err) {
    badge.textContent = '⚠️ 접근 권한이 없어요. 셀러용 QR코드로 다시 접속해주세요.';
  }
}

function renderSellerBadge() {
  const badge = document.getElementById('seller-badge');
  badge.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span>👋 <strong>${escapeHtml(currentSeller.seller_name)}</strong>님, 환영해요${currentSeller.booth_number ? ' (부스 ' + currentSeller.booth_number + '번)' : ''}</span>
      <button type="button" onclick="toggleEditForm(true)" style="width:auto; padding:4px 10px; font-size:11px; background:transparent; border:0.5px solid var(--border-strong); color:var(--ink);">정보 수정</button>
    </div>
  `;
}

function toggleEditForm(show) {
  document.getElementById('edit-seller-form').style.display = show ? 'block' : 'none';
  if (show) {
    document.getElementById('edit-seller-name').value = currentSeller.seller_name;
    document.getElementById('edit-contact-link').value = currentSeller.contact_link || '';
  }
}

async function saveSellerInfo() {
  const seller_name = document.getElementById('edit-seller-name').value.trim();
  const contact_link = document.getElementById('edit-contact-link').value.trim();

  if (!seller_name) {
    showToast('이름을 입력해주세요');
    return;
  }

  try {
    const res = await fetch(`/api/sellers/${encodeURIComponent(token)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seller_name, contact_link })
    });
    if (!res.ok) throw new Error('저장 실패');
    currentSeller = await res.json();
    renderSellerBadge();
    toggleEditForm(false);
    showToast('정보가 저장됐어요');
  } catch (err) {
    showToast('저장 중 오류가 발생했어요');
  }
}

uploadBox.addEventListener('click', () => imageInput.click());

categoryTags.forEach(tag => {
  tag.addEventListener('click', () => {
    categoryTags.forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
    selectedCategory = tag.dataset.value;
  });
});

imageInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  selectedFile = file;

  const reader = new FileReader();
  reader.onload = (ev) => {
    previewImg.src = ev.target.result;
    previewImg.style.display = 'block';
    uploadPlaceholder.style.display = 'none';
  };
  reader.readAsDataURL(file);

  aiBadge.style.display = 'flex';
  aiBadge.classList.add('loading');
  aiBadgeText.textContent = '✨ AI가 카테고리·설명 초안 작성 중...';

  try {
    const formData = new FormData();
    formData.append('image', file);
    const res = await fetch('/api/analyze', { method: 'POST', body: formData });
    const data = await res.json();

    document.getElementById('title').value = data.title || '';
    document.getElementById('description').value = data.description || '';

    if (data.category) {
      categoryTags.forEach(t => {
        t.classList.toggle('active', t.dataset.value === data.category);
      });
      selectedCategory = data.category;
    }
    aiBadgeText.textContent = '✨ AI 초안이 채워졌어요. 확인 후 수정해주세요.';
  } catch (err) {
    aiBadgeText.textContent = '⚠️ AI 분석에 실패했어요. 직접 입력해주세요.';
  } finally {
    aiBadge.classList.remove('loading');
  }
});

document.getElementById('sell-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!selectedFile) {
    showToast('사진을 먼저 등록해주세요');
    return;
  }
  if (!selectedCategory) {
    showToast('카테고리를 선택해주세요');
    return;
  }

  const formData = new FormData();
  formData.append('token', token);
  formData.append('image', selectedFile);
  formData.append('category', selectedCategory);
  formData.append('title', document.getElementById('title').value);
  formData.append('description', document.getElementById('description').value);
  formData.append('price', document.getElementById('price').value);

  try {
    const res = await fetch('/api/items', { method: 'POST', body: formData });
    if (!res.ok) throw new Error('등록 실패');
    showToast('등록되었습니다!');
    setTimeout(() => location.href = '/feed', 800);
  } catch (err) {
    showToast('등록 중 오류가 발생했어요');
  }
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

verifySeller();
</script>
</body>
</html>
