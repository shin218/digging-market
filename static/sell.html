<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>셀러 등록 · Digging Market</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#A85A45" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Digging Market" />
</head>
<body>
<div class="app">
  <div class="top-nav">
    <a href="/" class="back">←</a>
    <h2 class="page-title">상품 등록</h2>
  </div>

  <div class="content">
    <div id="seller-badge" style="background:#fff; border:0.5px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:16px; font-size:13px; color:var(--muted);">
      확인 중...
    </div>

    <div id="edit-seller-form" style="display:none; background:#fff; border:0.5px solid var(--border); border-radius:var(--radius-sm); padding:14px; margin-bottom:16px;">
      <label>셀러 이름 / 부스명</label>
      <input type="text" id="edit-seller-name" />

      <label>인스타그램 아이디</label>
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <div style="flex:1;">
          <div style="display:flex; align-items:center; background:var(--cream); border:0.5px solid var(--border); border-radius:var(--radius-sm); padding: 0 12px; margin-bottom:12px;">
            <span style="font-size:14px; color:var(--muted); white-space:nowrap;">instagram.com/</span>
            <input type="text" id="edit-contact-link" placeholder="아이디만 입력" style="border:none; padding:10px 4px; margin:0; background:transparent;" />
          </div>
        </div>
        <button type="button" class="btn-outline" style="width:auto; padding:10px 14px; white-space:nowrap; margin-top:0;" onclick="testInstagramLink('edit-contact-link')">테스트</button>
      </div>

      <p style="font-size:11px; color:var(--muted); margin: -4px 0 12px;">부스 번호는 운영진만 변경할 수 있어요.</p>

      <div style="display:flex; gap:8px;">
        <button type="button" class="btn-outline" style="flex:1;" onclick="toggleEditForm(false)">취소</button>
        <button type="button" class="btn-primary" style="flex:1;" onclick="saveSellerInfo()">저장</button>
      </div>
    </div>

    <div id="booth-missing" class="closed-notice" style="display:none;">
      ⚠️ 아직 부스 번호가 배정되지 않아 상품을 등록할 수 없어요.<br>
      <span>운영진에게 부스 배정을 요청해주세요. 배정되면 이 화면을 새로고침하면 돼요.</span>
    </div>

    <form id="sell-form" style="display:none;">
      <div class="upload-box" id="upload-box">
        <div class="placeholder" id="upload-placeholder">
          📷<br />사진 촬영 / 업로드
        </div>
        <img id="preview-img" style="display:none" />
      </div>
      <input type="file" id="image-input" accept="image/*" capture="environment" style="display:none" />

      <div class="ai-badge" id="ai-badge" style="display:none">
        <span id="ai-badge-text">✨ AI가 분석 중...</span>
      </div>

      <label>카테고리</label>
      <select id="category-select" style="width:100%; margin-bottom:12px; padding:10px 12px; border-radius:var(--radius-sm); border:0.5px solid var(--border); font-size:14px; background:#fff; color:var(--ink);">
        <option value="">불러오는 중...</option>
      </select>

      <label>상품명</label>
      <input type="text" id="title" placeholder="예: 비틀즈 Abbey Road" required />

      <label>설명</label>
      <textarea id="description" placeholder="상태, 특징 등을 적어주세요"></textarea>

      <label>판매 방식</label>
      <div class="segmented" id="sale-type-toggle">
        <button type="button" data-type="fixed" class="active">고정가 · 즉시구매</button>
        <button type="button" data-type="auction">🔨 경매</button>
      </div>

      <label id="price-label">가격 (원)</label>
      <input type="text" inputmode="numeric" id="price" placeholder="예: 15,000" />
      <p class="field-hint" id="price-hint">구매자가 이 가격에 바로 구매할 수 있어요. 구매되면 '예약중'으로 바뀌고 구매자 연락처가 전달돼요.</p>

      <div id="auction-fields" style="display:none;">
        <label>경매 기간</label>
        <select id="auction-minutes" class="select-field">
          <option value="10">10분</option>
          <option value="30">30분</option>
          <option value="60" selected>1시간</option>
          <option value="120">2시간</option>
          <option value="240">4시간</option>
          <option value="1440">1일</option>
          <option value="4320">3일</option>
        </select>

        <label>즉시구매가 (원, 선택)</label>
        <input type="text" inputmode="numeric" id="buy-now-price" placeholder="비워두면 경매로만 판매" />
        <p class="field-hint">첫 입찰이 들어오기 전까지만 이 가격으로 즉시구매할 수 있어요. 마감 3분 전 입찰이 들어오면 마감이 3분 연장돼요.</p>
      </div>

      <button type="submit" class="btn-primary" style="margin-top:8px;">등록하기</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');

function normalizeInstagramId(raw) {
  if (!raw) return '';
  let v = raw.trim();
  v = v.replace(/^https?:\/\//i, '');
  v = v.replace(/^(www\.)?instagram\.com\//i, '');
  v = v.replace(/^@/, '');
  v = v.replace(/\/.*$/, '');
  v = v.split('?')[0];
  return v.trim();
}

function testInstagramLink(inputId) {
  const raw = document.getElementById(inputId).value;
  const handle = normalizeInstagramId(raw);
  if (!handle) {
    showToast('아이디를 먼저 입력해주세요');
    return;
  }
  document.getElementById(inputId).value = handle;
  window.open(`https://instagram.com/${handle}`, '_blank');
}

const uploadBox = document.getElementById('upload-box');
const imageInput = document.getElementById('image-input');
const previewImg = document.getElementById('preview-img');
const uploadPlaceholder = document.getElementById('upload-placeholder');
const aiBadge = document.getElementById('ai-badge');
const aiBadgeText = document.getElementById('ai-badge-text');
const categorySelect = document.getElementById('category-select');
const priceInput = document.getElementById('price');
let selectedFile = null;
let availableCategories = [];

async function loadCategoryOptions() {
  try {
    const res = await fetch('/api/categories');
    availableCategories = await res.json();
    if (availableCategories.length === 0) {
      categorySelect.innerHTML = '<option value="">등록된 카테고리가 없어요</option>';
      return;
    }
    categorySelect.innerHTML =
      '<option value="">카테고리를 선택해주세요</option>' +
      availableCategories.map(c => `<option value="${escapeHtml(c.name)}">${c.icon} ${escapeHtml(c.name)}</option>`).join('');
  } catch (err) {
    categorySelect.innerHTML = '<option value="">카테고리를 불러오지 못했어요</option>';
  }
}

let currentSeller = null;

async function verifySeller() {
  const badge = document.getElementById('seller-badge');
  if (!token) {
    badge.textContent = '⚠️ 접근 권한이 없어요. 셀러용 QR코드로 다시 접속해주세요.';
    return;
  }
  try {
    const res = await fetch(`/api/sellers/verify?token=${encodeURIComponent(token)}`);
    if (!res.ok) throw new Error('invalid token');
    currentSeller = await res.json();
    renderSellerBadge();
    if (!(currentSeller.booth_number || '').trim()) {
      // 부스가 배정되지 않은 셀러는 상품 등록 불가 (서버에서도 막음)
      document.getElementById('booth-missing').style.display = 'block';
      return;
    }
    document.getElementById('sell-form').style.display = 'block';
  } catch (err) {
    badge.textContent = '⚠️ 접근 권한이 없어요. 셀러용 QR코드로 다시 접속해주세요.';
  }
}

function renderSellerBadge() {
  const badge = document.getElementById('seller-badge');
  badge.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span>👋 <strong>${escapeHtml(currentSeller.seller_name)}</strong>님, 환영해요${currentSeller.booth_number ? ' (부스 ' + currentSeller.booth_number + '번)' : ''}</span>
      <button type="button" onclick="toggleEditForm(true)" style="width:auto; padding:4px 10px; font-size:11px; background:transparent; border:0.5px solid var(--border-strong); color:var(--ink); flex-shrink:0;">정보 수정</button>
    </div>
    <a href="/my?token=${encodeURIComponent(token)}" style="font-size:12px; color:var(--brand); text-decoration:none;">📦 내가 등록한 상품 관리하기 →</a>
  `;
}

function toggleEditForm(show) {
  document.getElementById('edit-seller-form').style.display = show ? 'block' : 'none';
  if (show) {
    document.getElementById('edit-seller-name').value = currentSeller.seller_name;
    document.getElementById('edit-contact-link').value = currentSeller.contact_link || '';
  }
}

async function saveSellerInfo() {
  const seller_name = document.getElementById('edit-seller-name').value.trim();
  const contact_link = normalizeInstagramId(document.getElementById('edit-contact-link').value);

  if (!seller_name) {
    showToast('이름을 입력해주세요');
    return;
  }

  try {
    const res = await fetch(`/api/sellers/${encodeURIComponent(token)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seller_name, contact_link })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(typeof body.detail === 'string' ? body.detail : '저장 중 오류가 발생했어요');
    }
    currentSeller = await res.json();
    renderSellerBadge();
    toggleEditForm(false);
    // 셀러명은 다른 셀러와 같아도 저장되지만(부스로 구분), 알려는 준다
    showToast(currentSeller.warnings && currentSeller.warnings.length
      ? '저장됐어요 · 같은 이름의 셀러가 있어요'
      : '정보가 저장됐어요');
  } catch (err) {
    showToast(err.message || '저장 중 오류가 발생했어요');
  }
}

uploadBox.addEventListener('click', () => imageInput.click());

// 가격 입력에 실시간 콤마 포맷 적용
priceInput.addEventListener('input', () => {
  const digitsOnly = priceInput.value.replace(/[^\d]/g, '');
  priceInput.value = digitsOnly ? Number(digitsOnly).toLocaleString('ko-KR') : '';
});

function getRawPrice() {
  return priceInput.value.replace(/[^\d]/g, '');
}

// ---- 판매 방식 (고정가 / 경매) ----
let saleType = 'fixed';
const buyNowInput = document.getElementById('buy-now-price');

buyNowInput.addEventListener('input', () => {
  const digitsOnly = buyNowInput.value.replace(/[^\d]/g, '');
  buyNowInput.value = digitsOnly ? Number(digitsOnly).toLocaleString('ko-KR') : '';
});

document.querySelectorAll('#sale-type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    saleType = btn.dataset.type;
    document.querySelectorAll('#sale-type-toggle button').forEach(b => b.classList.toggle('active', b === btn));
    const isAuction = saleType === 'auction';
    document.getElementById('auction-fields').style.display = isAuction ? 'block' : 'none';
    document.getElementById('price-label').textContent = isAuction ? '시작가 (원)' : '가격 (원)';
    document.getElementById('price-hint').textContent = isAuction
      ? '첫 입찰은 시작가부터 받아요. 마감 시 최고 입찰자에게 낙찰되고, 낙찰자 연락처가 전달돼요.'
      : "구매자가 이 가격에 바로 구매할 수 있어요. 구매되면 '예약중'으로 바뀌고 구매자 연락처가 전달돼요.";
  });
});

imageInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  selectedFile = file;

  const reader = new FileReader();
  reader.onload = (ev) => {
    previewImg.src = ev.target.result;
    previewImg.style.display = 'block';
    uploadPlaceholder.style.display = 'none';
  };
  reader.readAsDataURL(file);

  aiBadge.style.display = 'flex';
  aiBadge.classList.add('loading');
  aiBadgeText.textContent = '✨ AI가 카테고리·설명 초안 작성 중...';

  try {
    const formData = new FormData();
    formData.append('image', file);
    const res = await fetch('/api/analyze', { method: 'POST', body: formData });
    const data = await res.json();

    document.getElementById('title').value = data.title || '';
    document.getElementById('description').value = data.description || '';
    if (data.category) {
      const matched = availableCategories.find(c => c.name === data.category);
      if (matched) {
        categorySelect.value = matched.name;
      }
    }
    aiBadgeText.textContent = data.ai_used
      ? '✨ AI 초안이 채워졌어요. 확인 후 수정해주세요.'
      : '📝 AI 분석을 사용할 수 없어요. 아래 정보를 직접 입력해주세요.';
  } catch (err) {
    aiBadgeText.textContent = '⚠️ AI 분석에 실패했어요. 직접 입력해주세요.';
  } finally {
    aiBadge.classList.remove('loading');
  }
});

document.getElementById('sell-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!selectedFile) {
    showToast('사진을 먼저 등록해주세요');
    return;
  }
  if (!categorySelect.value) {
    showToast('카테고리를 선택해주세요');
    return;
  }
  if (!getRawPrice()) {
    showToast(saleType === 'auction' ? '시작가를 입력해주세요' : '가격을 입력해주세요');
    return;
  }
  const buyNowRaw = buyNowInput.value.replace(/[^\d]/g, '');
  if (saleType === 'auction' && buyNowRaw && Number(buyNowRaw) <= Number(getRawPrice())) {
    showToast('즉시구매가는 시작가보다 높아야 해요');
    return;
  }

  const formData = new FormData();
  formData.append('token', token);
  formData.append('image', selectedFile);
  formData.append('category', categorySelect.value);
  formData.append('title', document.getElementById('title').value);
  formData.append('description', document.getElementById('description').value);
  formData.append('price', getRawPrice());
  formData.append('sale_type', saleType);
  if (saleType === 'auction') {
    formData.append('auction_minutes', document.getElementById('auction-minutes').value);
    if (buyNowRaw) formData.append('buy_now_price', buyNowRaw);
  }

  try {
    const res = await fetch('/api/items', { method: 'POST', body: formData });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(typeof body.detail === 'string' ? body.detail : '등록 중 오류가 발생했어요');
    }
    showToast('등록되었습니다!');
    setTimeout(() => location.href = '/feed', 800);
  } catch (err) {
    showToast(err.message || '등록 중 오류가 발생했어요');
  }
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

verifySeller();
loadCategoryOptions();
</script>
</body>
</html>
