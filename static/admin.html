<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>셀러 관리 · Digging Market Admin</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#A85A45" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Digging Market" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="app" style="max-width: 600px;">
  <div class="top-nav">
    <a href="/" class="back">←</a>
    <h2 class="page-title">관리자</h2>
  </div>

  <div class="content">
    <div class="tag-row" style="margin-bottom:16px;">
      <span class="tag selectable active" id="tab-sellers" onclick="switchTab('sellers')">셀러 관리</span>
      <span class="tag selectable" id="tab-categories" onclick="switchTab('categories')">카테고리 관리</span>
      <span class="tag selectable" id="tab-event" onclick="switchTab('event')">행사 정보</span>
    </div>

    <div id="panel-sellers">
      <p style="font-size: 13px; color: var(--muted); margin: 0 0 16px;">
        셀러를 등록하면 전용 QR코드가 생성돼요. 이 QR을 셀러에게 인쇄해서 나눠주세요.
        이 페이지 링크는 셀러/방문객에게 공유하지 마세요.
      </p>

      <form id="seller-form" style="margin-bottom: 24px;">
        <label>셀러 이름 / 부스명</label>
        <input type="text" id="seller-name" placeholder="예: 민지의 레코드샵" required />

        <label>부스 번호</label>
        <input type="text" id="booth-number" placeholder="예: 7" />

        <label>인스타그램 아이디</label>
        <div style="display:flex; gap:8px; align-items:flex-start;">
          <div style="flex:1;">
            <div style="display:flex; align-items:center; background:#fff; border:0.5px solid var(--border); border-radius:var(--radius-sm); padding: 0 12px; margin-bottom:12px;">
              <span style="font-size:14px; color:var(--muted); white-space:nowrap;">instagram.com/</span>
              <input type="text" id="contact-link" placeholder="아이디만 입력" style="border:none; padding:10px 4px; margin:0;" />
            </div>
          </div>
          <button type="button" class="btn-outline" style="width:auto; padding:10px 14px; white-space:nowrap; margin-top:0;" onclick="testInstagramLink('contact-link')">테스트</button>
        </div>

        <button type="submit" class="btn-primary">셀러 등록 + QR 발급</button>
      </form>

      <p class="section-title" style="margin-top:0;">등록된 셀러 목록</p>
      <div id="seller-list"></div>
    </div>

    <div id="panel-categories" style="display:none;">
      <p style="font-size: 13px; color: var(--muted); margin: 0 0 16px;">
        여기서 등록한 카테고리가 메인 페이지, 상품 구경하기, 셀러 상품 등록 화면에 그대로 반영돼요.
      </p>

      <form id="category-form" style="margin-bottom: 20px;">
        <label>아이콘 (이모지 하나)</label>
        <div class="tag-row" id="icon-presets" style="margin-bottom:8px;">
          <span class="tag selectable" data-icon="💿">💿</span>
          <span class="tag selectable" data-icon="📼">📼</span>
          <span class="tag selectable" data-icon="👕">👕</span>
          <span class="tag selectable" data-icon="👟">👟</span>
          <span class="tag selectable" data-icon="👜">👜</span>
          <span class="tag selectable" data-icon="💎">💎</span>
          <span class="tag selectable" data-icon="📚">📚</span>
          <span class="tag selectable" data-icon="🎨">🎨</span>
          <span class="tag selectable" data-icon="📦">📦</span>
        </div>
        <input type="text" id="category-icon" placeholder="위에서 고르거나 직접 이모지 입력" maxlength="4" required />

        <label>카테고리 이름</label>
        <input type="text" id="category-name" placeholder="예: 필름카메라" required />

        <button type="submit" class="btn-primary">카테고리 추가</button>
      </form>

      <p class="section-title" style="margin-top:0;">등록된 카테고리</p>
      <div id="category-list"></div>
    </div>

    <div id="panel-event" style="display:none;">
      <p style="font-size: 13px; color: var(--muted); margin: 0 0 16px;">
        여기서 설정하면 메인 페이지에 바로 반영돼요.
      </p>

      <form id="event-form">
        <label>날짜</label>
        <input type="text" id="event-date-input" placeholder="예: 11.22 (토)" />

        <label>시간</label>
        <input type="text" id="event-time-input" placeholder="예: 오후 12시 ~ 6시" />

        <label>장소</label>
        <input type="text" id="event-place-input" placeholder="예: 연남동 경의선숲길 인근" />

        <button type="submit" class="btn-primary">저장</button>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE_URL = window.location.origin;

// 사용자가 실수로 URL이나 @를 넣어도 순수 아이디만 남기는 정규화
function normalizeInstagramId(raw) {
  if (!raw) return '';
  let v = raw.trim();
  v = v.replace(/^https?:\/\//i, '');
  v = v.replace(/^(www\.)?instagram\.com\//i, '');
  v = v.replace(/^@/, '');
  v = v.replace(/\/.*$/, '');
  v = v.split('?')[0];
  return v.trim();
}

function testInstagramLink(inputId) {
  const raw = document.getElementById(inputId).value;
  const handle = normalizeInstagramId(raw);
  if (!handle) {
    showToast('아이디를 먼저 입력해주세요');
    return;
  }
  document.getElementById(inputId).value = handle;
  window.open(`https://instagram.com/${handle}`, '_blank');
}

function switchTab(tab) {
  document.getElementById('tab-sellers').classList.toggle('active', tab === 'sellers');
  document.getElementById('tab-categories').classList.toggle('active', tab === 'categories');
  document.getElementById('tab-event').classList.toggle('active', tab === 'event');
  document.getElementById('panel-sellers').style.display = tab === 'sellers' ? 'block' : 'none';
  document.getElementById('panel-categories').style.display = tab === 'categories' ? 'block' : 'none';
  document.getElementById('panel-event').style.display = tab === 'event' ? 'block' : 'none';
  if (tab === 'categories') loadCategories();
  if (tab === 'event') loadEventSettings();
}

document.getElementById('seller-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    seller_name: document.getElementById('seller-name').value,
    booth_number: document.getElementById('booth-number').value,
    contact_link: normalizeInstagramId(document.getElementById('contact-link').value),
  };
  const res = await fetch('/api/admin/sellers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    document.getElementById('seller-form').reset();
    showToast('셀러가 등록됐어요');
    loadSellers();
  } else {
    showToast('등록 실패');
  }
});

async function loadSellers() {
  const res = await fetch('/api/admin/sellers');
  const sellers = await res.json();
  const listEl = document.getElementById('seller-list');

  if (sellers.length === 0) {
    listEl.innerHTML = '<div class="empty-state">아직 등록된 셀러가 없어요.</div>';
    return;
  }

  listEl.innerHTML = sellers.map(s => `
    <div style="background:#fff; border:0.5px solid var(--border); border-radius:var(--radius-sm); padding:14px; margin-bottom:10px; display:flex; gap:14px; align-items:center;">
      <div id="qr-${s.token}" style="flex-shrink:0;"></div>
      <div style="flex:1; min-width:0;">
        <p style="margin:0; font-weight:600; font-size:14px;">${escapeHtml(s.seller_name)}${s.booth_number ? ' · ' + s.booth_number + '번' : ''}</p>
        <p style="margin:4px 0; font-size:12px; color:var(--muted); word-break:break-all;">${BASE_URL}/sell?token=${s.token}</p>
        <button class="btn-outline" style="width:auto; padding:6px 12px; font-size:12px;" onclick="copyLink('${s.token}')">링크 복사</button>
      </div>
    </div>
  `).join('');

  sellers.forEach(s => {
    new QRCode(document.getElementById(`qr-${s.token}`), {
      text: `${BASE_URL}/sell?token=${s.token}`,
      width: 72,
      height: 72,
    });
  });
}

function copyLink(token) {
  navigator.clipboard.writeText(`${BASE_URL}/sell?token=${token}`);
  showToast('링크가 복사됐어요');
}

// ---------------- 카테고리 관리 ----------------
document.querySelectorAll('#icon-presets .tag').forEach(tag => {
  tag.addEventListener('click', () => {
    document.querySelectorAll('#icon-presets .tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
    document.getElementById('category-icon').value = tag.dataset.icon;
  });
});

document.getElementById('category-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    name: document.getElementById('category-name').value.trim(),
    icon: document.getElementById('category-icon').value.trim(),
  };
  if (!payload.name || !payload.icon) {
    showToast('아이콘과 이름을 모두 입력해주세요');
    return;
  }
  const res = await fetch('/api/admin/categories', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    document.getElementById('category-form').reset();
    document.querySelectorAll('#icon-presets .tag').forEach(t => t.classList.remove('active'));
    showToast('카테고리가 추가됐어요');
    loadCategories();
  } else {
    const err = await res.json();
    showToast(err.detail || '추가 실패');
  }
});

async function loadCategories() {
  const res = await fetch('/api/categories');
  const categories = await res.json();
  const listEl = document.getElementById('category-list');

  if (categories.length === 0) {
    listEl.innerHTML = '<div class="empty-state">아직 등록된 카테고리가 없어요.</div>';
    return;
  }

  listEl.innerHTML = categories.map(c => `
    <div style="background:#fff; border:0.5px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px;">
      <span style="font-size:22px;">${c.icon}</span>
      <span style="flex:1; font-size:14px; font-weight:600;">${escapeHtml(c.name)}</span>
      ${c.name === '기타'
        ? '<span style="font-size:11px; color:var(--muted);">기본값 (삭제 불가)</span>'
        : `<button class="btn-outline" style="width:auto; padding:6px 10px; font-size:12px; color:var(--danger); border-color:var(--danger);" onclick="deleteCategory('${c.id}', '${escapeHtml(c.name)}')">삭제</button>`
      }
    </div>
  `).join('');
}

async function deleteCategory(id, name) {
  if (!confirm(`"${name}" 카테고리를 삭제할까요?\n이 카테고리로 등록된 상품은 자동으로 '기타'로 이동해요.`)) return;
  const res = await fetch(`/api/admin/categories/${id}`, { method: 'DELETE' });
  if (res.ok) {
    showToast('삭제됐어요');
    loadCategories();
  } else {
    const err = await res.json();
    showToast(err.detail || '삭제 실패');
  }
}

// ---------------- 행사 정보 ----------------
async function loadEventSettings() {
  const res = await fetch('/api/event');
  const data = await res.json();
  document.getElementById('event-date-input').value = data.event_date || '';
  document.getElementById('event-time-input').value = data.event_time || '';
  document.getElementById('event-place-input').value = data.event_place || '';
}

document.getElementById('event-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    event_date: document.getElementById('event-date-input').value.trim(),
    event_time: document.getElementById('event-time-input').value.trim(),
    event_place: document.getElementById('event-place-input').value.trim(),
  };
  const res = await fetch('/api/admin/event', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    showToast('행사 정보가 저장됐어요');
  } else {
    showToast('저장 실패');
  }
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

loadSellers();
</script>
</body>
</html>
