<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>셀러 관리 · Digging Market Admin</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#A85A45" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Digging Market" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="app" style="max-width: 600px;">
  <div class="top-nav">
    <a href="/" class="back">←</a>
    <h2 class="page-title">관리자</h2>
  </div>

  <div class="content">
    <div class="tag-row" style="margin-bottom:16px;">
      <span class="tag selectable active" id="tab-sellers" onclick="switchTab('sellers')">셀러 관리</span>
      <span class="tag selectable" id="tab-categories" onclick="switchTab('categories')">카테고리 관리</span>
      <span class="tag selectable" id="tab-event" onclick="switchTab('event')">행사 정보</span>
    </div>

    <div id="panel-sellers">
      <p style="font-size: 13px; color: var(--muted); margin: 0 0 16px;">
        셀러를 등록하면 전용 QR코드가 생성돼요. 이 QR을 셀러에게 인쇄해서 나눠주세요.
        이 페이지 링크는 셀러/방문객에게 공유하지 마세요.
      </p>

      <form id="seller-form" style="margin-bottom: 24px;">
        <label>셀러 이름 / 부스명 <span class="required-mark">*</span></label>
        <input type="text" id="seller-name" placeholder="예: 민지의 레코드샵" required />
        <p class="field-error" id="err-seller_name"></p>

        <label>부스 번호 <span class="required-mark">*</span></label>
        <input type="text" id="booth-number" placeholder="예: 7" required />
        <p class="field-error" id="err-booth_number"></p>

        <label>인스타그램 아이디</label>
        <div style="display:flex; gap:8px; align-items:flex-start;">
          <div style="flex:1;">
            <div id="contact-link-wrap" style="display:flex; align-items:center; background:#fff; border:0.5px solid var(--border); border-radius:var(--radius-sm); padding: 0 12px; margin-bottom:12px;">
              <span style="font-size:14px; color:var(--muted); white-space:nowrap;">instagram.com/</span>
              <input type="text" id="contact-link" placeholder="아이디만 입력" style="border:none; padding:10px 4px; margin:0; box-shadow:none;" />
            </div>
            <p class="field-error" id="err-contact_link"></p>
          </div>
          <button type="button" class="btn-outline" style="width:auto; padding:10px 14px; white-space:nowrap; margin-top:0;" onclick="testInstagramLink('contact-link')">테스트</button>
        </div>

        <button type="submit" class="btn-primary" id="seller-submit">셀러 등록 + QR 발급</button>
      </form>

      <p class="section-title" style="margin-top:0;">등록된 셀러 목록</p>
      <div id="seller-list"></div>
    </div>

    <div id="panel-categories" style="display:none;">
      <p style="font-size: 13px; color: var(--muted); margin: 0 0 16px;">
        여기서 등록한 카테고리가 메인 페이지, 상품 구경하기, 셀러 상품 등록 화면에 그대로 반영돼요.
      </p>

      <form id="category-form" style="margin-bottom: 20px;">
        <label>아이콘 (이모지 하나)</label>
        <div class="tag-row" id="icon-presets" style="margin-bottom:8px;">
          <span class="tag selectable" data-icon="💿">💿</span>
          <span class="tag selectable" data-icon="📼">📼</span>
          <span class="tag selectable" data-icon="👕">👕</span>
          <span class="tag selectable" data-icon="👟">👟</span>
          <span class="tag selectable" data-icon="👜">👜</span>
          <span class="tag selectable" data-icon="💎">💎</span>
          <span class="tag selectable" data-icon="📚">📚</span>
          <span class="tag selectable" data-icon="🎨">🎨</span>
          <span class="tag selectable" data-icon="📦">📦</span>
        </div>
        <input type="text" id="category-icon" placeholder="위에서 고르거나 직접 이모지 입력" maxlength="4" required />

        <label>카테고리 이름</label>
        <input type="text" id="category-name" placeholder="예: 필름카메라" required />

        <button type="submit" class="btn-primary">카테고리 추가</button>
      </form>

      <p class="section-title" style="margin-top:0;">등록된 카테고리</p>
      <div id="category-list"></div>
    </div>

    <div id="panel-event" style="display:none;">
      <p style="font-size: 13px; color: var(--muted); margin: 0 0 16px;">
        여기서 설정하면 메인 페이지에 바로 반영돼요.
      </p>

      <form id="event-form">
        <label>날짜</label>
        <input type="text" id="event-date-input" placeholder="예: 11.22 (토)" />

        <label>시간</label>
        <input type="text" id="event-time-input" placeholder="예: 오후 12시 ~ 6시" />

        <label>장소</label>
        <input type="text" id="event-place-input" placeholder="예: 연남동 경의선숲길 인근" />

        <button type="submit" class="btn-primary">저장</button>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE_URL = window.location.origin;

// 사용자가 실수로 URL이나 @를 넣어도 순수 아이디만 남기는 정규화
function normalizeInstagramId(raw) {
  if (!raw) return '';
  let v = raw.trim();
  v = v.replace(/^https?:\/\//i, '');
  v = v.replace(/^(www\.)?instagram\.com\//i, '');
  v = v.replace(/^@/, '');
  v = v.replace(/\/.*$/, '');
  v = v.split('?')[0];
  return v.trim();
}

function testInstagramLink(inputId) {
  const raw = document.getElementById(inputId).value;
  const handle = normalizeInstagramId(raw);
  if (!handle) {
    showToast('아이디를 먼저 입력해주세요');
    return;
  }
  document.getElementById(inputId).value = handle;
  window.open(`https://instagram.com/${handle}`, '_blank');
}

function switchTab(tab) {
  document.getElementById('tab-sellers').classList.toggle('active', tab === 'sellers');
  document.getElementById('tab-categories').classList.toggle('active', tab === 'categories');
  document.getElementById('tab-event').classList.toggle('active', tab === 'event');
  document.getElementById('panel-sellers').style.display = tab === 'sellers' ? 'block' : 'none';
  document.getElementById('panel-categories').style.display = tab === 'categories' ? 'block' : 'none';
  document.getElementById('panel-event').style.display = tab === 'event' ? 'block' : 'none';
  if (tab === 'categories') loadCategories();
  if (tab === 'event') loadEventSettings();
}

// ---------------- 셀러 등록 + 중복 체크 ----------------
// 부스 번호·인스타 중복 → 저장 불가(빨강) / 셀러명 중복 → 경고만(주황), 저장 가능
const SELLER_INPUTS = {
  seller_name: 'seller-name',
  booth_number: 'booth-number',
  contact_link: 'contact-link',
};
const FIELD_LABELS = { seller_name: '이름', booth_number: '부스 번호', contact_link: '인스타' };
let currentConflicts = [];
let checkTimer = null;
let checkSeq = 0;

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

function hasBlocking(conflicts) {
  return conflicts.some(c => c.blocking);
}

function sellerPayload() {
  return {
    seller_name: document.getElementById('seller-name').value.trim(),
    booth_number: document.getElementById('booth-number').value.trim(),
    contact_link: normalizeInstagramId(document.getElementById('contact-link').value),
  };
}

// 필수 입력 누락 에러는 중복 체크 결과와 따로 관리 (중복 체크 응답이 필수 에러를 지우지 않게)
const requiredErrors = {};

function renderConflicts(conflicts) {
  currentConflicts = conflicts;
  Object.entries(SELLER_INPUTS).forEach(([field, inputId]) => {
    const conflict = conflicts.find(c => c.field === field);
    const isError = (conflict && conflict.blocking) || (!conflict && !!requiredErrors[field]);
    const message = conflict ? conflict.message : requiredErrors[field];
    const msgEl = document.getElementById(`err-${field}`);
    msgEl.textContent = message ? `⚠ ${message}` : '';
    msgEl.classList.toggle('is-warning', !!message && !isError);
    // 인스타 입력칸은 테두리가 바깥 래퍼에 있으므로 래퍼에 표시
    const target = field === 'contact_link' ? document.getElementById('contact-link-wrap') : document.getElementById(inputId);
    target.classList.toggle('has-error', isError);
  });
  document.getElementById('seller-submit').disabled = hasBlocking(conflicts);
}

async function fetchConflicts(payload, excludeToken) {
  const params = new URLSearchParams(payload);
  if (excludeToken) params.set('exclude_token', excludeToken);
  const res = await fetch(`/api/admin/sellers/check?${params}`);
  return (await res.json()).conflicts;
}

async function checkDuplicates() {
  const seq = ++checkSeq; // 늦게 도착한 이전 응답이 최신 결과를 덮어쓰지 않게
  try {
    const conflicts = await fetchConflicts(sellerPayload());
    if (seq === checkSeq) renderConflicts(conflicts);
  } catch (err) {
    // 확인 실패 시엔 막지 않음 — 서버가 등록할 때 한 번 더 검사함
  }
}

Object.entries(SELLER_INPUTS).forEach(([field, id]) => {
  document.getElementById(id).addEventListener('input', () => {
    delete requiredErrors[field]; // 해당 칸을 고치기 시작하면 필수 에러는 지움
    clearTimeout(checkTimer);
    checkTimer = setTimeout(checkDuplicates, 300);
  });
});

document.getElementById('seller-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (hasBlocking(currentConflicts)) {
    showToast('중복된 항목을 먼저 수정해주세요');
    return;
  }
  const payload = sellerPayload();
  if (!payload.booth_number.replace(/번$/, '')) {
    requiredErrors.booth_number = '부스 번호를 입력해주세요';
    renderConflicts(currentConflicts);
    document.getElementById('booth-number').focus();
    return;
  }
  const res = await fetch('/api/admin/sellers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    const body = await res.json();
    document.getElementById('seller-form').reset();
    Object.keys(requiredErrors).forEach(k => delete requiredErrors[k]);
    renderConflicts([]);
    showToast(body.warnings && body.warnings.length ? '셀러가 등록됐어요 · 같은 이름의 셀러가 있어요' : '셀러가 등록됐어요');
    loadSellers();
  } else {
    const err = await res.json().catch(() => ({}));
    showToast(typeof err.detail === 'string' ? err.detail : '등록 실패');
    if (res.status === 409) checkDuplicates(); // 어느 칸이 겹치는지 표시
  }
});

// ---------------- 셀러 목록 + 관리자 수정 ----------------
function boothText(booth) {
  return booth ? `${escapeHtml(String(booth).trim().replace(/번$/, ''))}번` : '';
}

function sellerEditFormHtml(s) {
  const t = s.token;
  const needsBooth = !s.booth_number;
  return `
    <div class="seller-edit" id="edit-${t}" style="display:${needsBooth ? 'block' : 'none'};">
      <label>셀러 이름 <span class="required-mark">*</span></label>
      <input type="text" id="e-name-${t}" value="${escapeAttr(s.seller_name)}" oninput="scheduleEditCheck('${t}')" />
      <label>부스 번호 <span class="required-mark">*</span></label>
      <input type="text" id="e-booth-${t}" value="${escapeAttr(s.booth_number || '')}" placeholder="예: 7" oninput="scheduleEditCheck('${t}')" />
      <label>인스타그램 아이디</label>
      <input type="text" id="e-insta-${t}" value="${escapeAttr(s.contact_link || '')}" placeholder="아이디만 입력" oninput="scheduleEditCheck('${t}')" />
      <div id="e-msg-${t}"></div>
      <div style="display:flex; gap:8px;">
        ${needsBooth ? '' : `<button type="button" class="btn-outline" style="flex:1;" onclick="toggleSellerEdit('${t}')">취소</button>`}
        <button type="button" class="btn-primary" style="flex:1;" id="e-save-${t}" onclick="saveSellerEdit('${t}')">${needsBooth ? '부스 배정하고 저장' : '저장'}</button>
      </div>
    </div>`;
}

async function loadSellers() {
  const res = await fetch('/api/admin/sellers');
  const sellers = await res.json();
  const listEl = document.getElementById('seller-list');

  if (sellers.length === 0) {
    listEl.innerHTML = '<div class="empty-state">아직 등록된 셀러가 없어요.</div>';
    return;
  }

  listEl.innerHTML = sellers.map(s => `
    <div class="seller-card">
      <div class="seller-card-row">
        <div id="qr-${s.token}" style="flex-shrink:0;"></div>
        <div style="flex:1; min-width:0;">
          <p style="margin:0; font-weight:600; font-size:14px;">${escapeHtml(s.seller_name)}${s.booth_number ? ' · ' + boothText(s.booth_number) : ''}${(s.duplicate_fields || []).length ? `<span class="dup-badge" title="다른 셀러와 겹치는 항목이 있어요">중복: ${s.duplicate_fields.map(f => FIELD_LABELS[f]).join(', ')}</span>` : ''}</p>
          ${s.contact_link ? `<p style="margin:2px 0 0; font-size:12px; color:var(--muted);">@${escapeHtml(s.contact_link)}</p>` : ''}
          ${s.booth_number ? '' : '<p style="margin:4px 0 0;"><span class="dup-badge" style="margin-left:0;">부스 미배정 · 상품 등록 불가</span></p>'}
          <p style="margin:4px 0; font-size:12px; color:var(--muted); word-break:break-all;">${BASE_URL}/sell?token=${s.token}</p>
          <div style="display:flex; gap:6px; align-items:center;">
            <button class="btn-outline" style="width:auto; padding:6px 12px; font-size:12px;" onclick="copyLink('${s.token}')">링크 복사</button>
            ${s.booth_number ? `<button type="button" class="link-btn" onclick="toggleSellerEdit('${s.token}')">정보 수정</button>` : ''}
          </div>
        </div>
      </div>
      ${sellerEditFormHtml(s)}
    </div>
  `).join('');

  if (typeof QRCode === 'undefined') return; // CDN 차단/오프라인 시 QR만 빠지고 나머지는 동작
  sellers.forEach(s => {
    new QRCode(document.getElementById(`qr-${s.token}`), {
      text: `${BASE_URL}/sell?token=${s.token}`,
      width: 72,
      height: 72,
    });
  });
}

function toggleSellerEdit(token) {
  const el = document.getElementById(`edit-${token}`);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  if (el.style.display === 'block') document.getElementById(`e-name-${token}`).focus();
}

function editPayload(token) {
  return {
    seller_name: document.getElementById(`e-name-${token}`).value.trim(),
    booth_number: document.getElementById(`e-booth-${token}`).value.trim(),
    contact_link: normalizeInstagramId(document.getElementById(`e-insta-${token}`).value),
  };
}

/** 수정 폼 아래 메시지: 오류(빨강, 저장 불가) + 경고(주황, 저장 가능) */
function renderEditMessages(token, errors, warnings) {
  document.getElementById(`e-msg-${token}`).innerHTML =
    errors.map(m => `<p class="field-error">⚠ ${escapeHtml(m)}</p>`).join('') +
    warnings.map(m => `<p class="field-error is-warning">⚠ ${escapeHtml(m)}</p>`).join('');
  document.getElementById(`e-save-${token}`).disabled = errors.length > 0;
}

const editTimers = {};
const editSeq = {};

function scheduleEditCheck(token) {
  clearTimeout(editTimers[token]);
  editTimers[token] = setTimeout(async () => {
    const seq = editSeq[token] = (editSeq[token] || 0) + 1;
    try {
      const conflicts = await fetchConflicts(editPayload(token), token);
      if (seq !== editSeq[token]) return;
      renderEditMessages(token,
        conflicts.filter(c => c.blocking).map(c => c.message),
        conflicts.filter(c => !c.blocking).map(c => c.message));
      // 저장을 막는 칸(부스/인스타)에 빨간 테두리 — 등록 폼과 같은 표시
      const blockingFields = conflicts.filter(c => c.blocking).map(c => c.field);
      document.getElementById(`e-booth-${token}`).classList.toggle('has-error', blockingFields.includes('booth_number'));
      document.getElementById(`e-insta-${token}`).classList.toggle('has-error', blockingFields.includes('contact_link'));
    } catch (err) { /* 저장할 때 서버가 다시 검사함 */ }
  }, 300);
}

async function saveSellerEdit(token) {
  const payload = editPayload(token);
  const missing = [];
  if (!payload.seller_name) missing.push('셀러 이름을 입력해주세요');
  if (!payload.booth_number.replace(/번$/, '')) missing.push('부스 번호를 입력해주세요');
  if (missing.length) {
    renderEditMessages(token, missing, []);
    document.getElementById(`e-save-${token}`).disabled = false;
    return;
  }
  const res = await fetch(`/api/admin/sellers/${encodeURIComponent(token)}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const body = await res.json().catch(() => ({}));
  if (res.ok) {
    showToast(body.warnings && body.warnings.length ? '저장됐어요 · 같은 이름의 셀러가 있어요' : '저장됐어요');
    loadSellers();
  } else {
    renderEditMessages(token, [typeof body.detail === 'string' ? body.detail : '저장하지 못했어요'], []);
  }
}

function copyLink(token) {
  navigator.clipboard.writeText(`${BASE_URL}/sell?token=${token}`);
  showToast('링크가 복사됐어요');
}

// ---------------- 카테고리 관리 ----------------
document.querySelectorAll('#icon-presets .tag').forEach(tag => {
  tag.addEventListener('click', () => {
    document.querySelectorAll('#icon-presets .tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
    document.getElementById('category-icon').value = tag.dataset.icon;
  });
});

document.getElementById('category-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    name: document.getElementById('category-name').value.trim(),
    icon: document.getElementById('category-icon').value.trim(),
  };
  if (!payload.name || !payload.icon) {
    showToast('아이콘과 이름을 모두 입력해주세요');
    return;
  }
  const res = await fetch('/api/admin/categories', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    document.getElementById('category-form').reset();
    document.querySelectorAll('#icon-presets .tag').forEach(t => t.classList.remove('active'));
    showToast('카테고리가 추가됐어요');
    loadCategories();
  } else {
    const err = await res.json();
    showToast(err.detail || '추가 실패');
  }
});

async function loadCategories() {
  const res = await fetch('/api/categories');
  const categories = await res.json();
  const listEl = document.getElementById('category-list');

  if (categories.length === 0) {
    listEl.innerHTML = '<div class="empty-state">아직 등록된 카테고리가 없어요.</div>';
    return;
  }

  listEl.innerHTML = categories.map(c => `
    <div style="background:#fff; border:0.5px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px;">
      <span style="font-size:22px;">${c.icon}</span>
      <span style="flex:1; font-size:14px; font-weight:600;">${escapeHtml(c.name)}</span>
      ${c.name === '기타'
        ? '<span style="font-size:11px; color:var(--muted);">기본값 (삭제 불가)</span>'
        : `<button class="btn-outline" style="width:auto; padding:6px 10px; font-size:12px; color:var(--danger); border-color:var(--danger);" onclick="deleteCategory('${c.id}', '${escapeHtml(c.name)}')">삭제</button>`
      }
    </div>
  `).join('');
}

async function deleteCategory(id, name) {
  if (!confirm(`"${name}" 카테고리를 삭제할까요?\n이 카테고리로 등록된 상품은 자동으로 '기타'로 이동해요.`)) return;
  const res = await fetch(`/api/admin/categories/${id}`, { method: 'DELETE' });
  if (res.ok) {
    showToast('삭제됐어요');
    loadCategories();
  } else {
    const err = await res.json();
    showToast(err.detail || '삭제 실패');
  }
}

// ---------------- 행사 정보 ----------------
async function loadEventSettings() {
  const res = await fetch('/api/event');
  const data = await res.json();
  document.getElementById('event-date-input').value = data.event_date || '';
  document.getElementById('event-time-input').value = data.event_time || '';
  document.getElementById('event-place-input').value = data.event_place || '';
}

document.getElementById('event-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    event_date: document.getElementById('event-date-input').value.trim(),
    event_time: document.getElementById('event-time-input').value.trim(),
    event_place: document.getElementById('event-place-input').value.trim(),
  };
  const res = await fetch('/api/admin/event', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    showToast('행사 정보가 저장됐어요');
  } else {
    showToast('저장 실패');
  }
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

loadSellers();
