<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Digging Market</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#A85A45" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Digging Market" />
</head>
<body>
<div class="app">
  <div class="hero">
    <p class="eyebrow">Curated Vinyl &amp; Vintage Market</p>
    <h1>Digging Market</h1>
    <div class="tag-row">
      <span class="tag active">Vinyl</span>
      <span class="tag active">Cassette</span>
      <span class="tag active">Y2K</span>
    </div>
  </div>

  <div class="content">
    <div class="info-row">
      <div class="info-card">
        <div>📅</div>
        <div class="label" id="event-date">날짜 미정</div>
      </div>
      <div class="info-card">
        <div>🕐</div>
        <div class="label" id="event-time">시간 미정</div>
      </div>
      <div class="info-card">
        <div>📍</div>
        <div class="label" id="event-place">장소 미정</div>
      </div>
    </div>

    <div class="btn-block">
      <a href="/feed" style="text-decoration:none; display:block;">
        <button class="btn-primary">🔍 상품 구경하기</button>
      </a>
    </div>
    <p style="font-size:12px; color:var(--muted); text-align:center; margin: 4px 0 0;">
      셀러라면 부스에 배부된 전용 QR코드로 접속해주세요
    </p>

    <p class="section-title">카테고리별로 보기</p>
    <div class="category-grid" id="category-grid">
      <div class="empty-state" style="grid-column: 1 / -1; padding: 12px;">불러오는 중...</div>
    </div>
  </div>
</div>

<script>
async function loadEventInfo() {
  try {
    const res = await fetch('/api/event');
    const data = await res.json();
    document.getElementById('event-date').textContent = data.event_date || '날짜 미정';
    document.getElementById('event-time').textContent = data.event_time || '시간 미정';
    document.getElementById('event-place').textContent = data.event_place || '장소 미정';
  } catch (err) {
    // 실패해도 기본 텍스트("미정")가 이미 표시되어 있으니 그대로 둠
  }
}

async function loadCategoryGrid() {
  const grid = document.getElementById('category-grid');
  try {
    const res = await fetch('/api/categories');
    const categories = await res.json();

    const likedCell = `
      <div class="category-cell category-cell-liked" onclick="location.href='/feed?liked=1'">
        <span class="liked-heart">♥</span><span>찜한 것만</span>
      </div>
    `;

    if (categories.length === 0) {
      grid.innerHTML = likedCell;
      return;
    }
    grid.innerHTML = categories.map(c => `
      <div class="category-cell" onclick="location.href='/feed?category=${encodeURIComponent(c.name)}'">
        <div>${c.icon}</div><span>${escapeHtml(c.name)}</span>
      </div>
    `).join('') + likedCell;
  } catch (err) {
    grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">불러오지 못했어요.</div>';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

loadEventInfo();
loadCategoryGrid();
</script>
</body>
</html>
