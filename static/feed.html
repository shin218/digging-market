<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>둘러보기 · Digging Market</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#A85A45" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Digging Market" />
</head>
<body>
<div class="app">
  <div class="top-nav">
    <a href="/" class="back">←</a>
    <h2 class="page-title">둘러보기</h2>
  </div>

  <div class="content">
    <div class="filter-row" id="filter-row">
      <span class="tag selectable active" data-value="전체">전체</span>
      <span id="category-filter-slot"></span>
      <span class="tag selectable" id="liked-only-toggle">♡ 찜한 것만</span>
      <span class="tag selectable" id="my-activity-toggle" style="white-space:nowrap;">🔨 내 입찰·구매</span>
    </div>

    <div class="item-list" id="item-list">
      <div class="empty-state">불러오는 중...</div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal" style="display:none">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="상품 상세">
    <div class="modal-header">
      <span class="modal-handle"></span>
      <button type="button" class="modal-close" aria-label="닫기" onclick="closeDetail()">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const likedOnlyToggle = document.getElementById('liked-only-toggle');
const myActivityToggle = document.getElementById('my-activity-toggle');
const categoryFilterSlot = document.getElementById('category-filter-slot');
let currentCategory = '전체';
let likedOnly = false;
let myActivity = false;
const likedItems = new Set(JSON.parse(localStorage.getItem('liked_items') || '[]'));

const params = new URLSearchParams(location.search);
if (params.get('category')) {
  currentCategory = params.get('category');
}
if (params.get('liked') === '1') {
  likedOnly = true;
}

// ---------------------------------------------------------------------------
// 구매자 식별 — 로그인 없이, 이 브라우저에서 만든 익명 토큰 + 닉네임 + 연락처
// ---------------------------------------------------------------------------
function randomToken() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}

function getBuyer() {
  let profile = {};
  try { profile = JSON.parse(localStorage.getItem('buyer_profile') || '{}'); } catch (e) {}
  if (!profile.token) {
    profile.token = randomToken();
    localStorage.setItem('buyer_profile', JSON.stringify(profile));
  }
  return profile;
}

function saveBuyer(name, contact) {
  const profile = getBuyer();
  profile.name = name;
  profile.contact = contact;
  localStorage.setItem('buyer_profile', JSON.stringify(profile));
}

let editingBuyer = false;

function buyerBoxHtml() {
  const p = getBuyer();
  if (p.name && p.contact && !editingBuyer) {
    return `
      <div class="buyer-box">
        <div class="line">
          <span>👤 <strong>${escapeHtml(p.name)}</strong> · ${escapeHtml(p.contact)}</span>
          <button type="button" class="link-btn" onclick="editBuyer()">변경</button>
        </div>
      </div>`;
  }
  return `
    <div class="buyer-box">
      <label>입찰·구매자 정보</label>
      <div class="buyer-fields">
        <input type="text" id="buyer-name" maxlength="20" value="${escapeAttr(p.name || '')}" placeholder="닉네임" aria-label="닉네임" />
        <input type="text" id="buyer-contact" maxlength="50" value="${escapeAttr(p.contact || '')}" placeholder="인스타 ID 또는 전화번호" aria-label="연락처" />
      </div>
      <p class="field-hint" style="margin:8px 0 0;">연락처는 낙찰·구매 시 셀러에게만 전달되고, 다른 사람에겐 닉네임 첫 글자만 보여요.</p>
    </div>`;
}

function editBuyer() {
  editingBuyer = true;
  const slot = document.getElementById('buyer-slot');
  if (slot) slot.innerHTML = buyerBoxHtml();
}

/** 입력칸이 열려 있으면 그 값을, 아니면 저장된 값을 쓴다. 비어 있으면 null */
function collectBuyer() {
  const nameEl = document.getElementById('buyer-name');
  const contactEl = document.getElementById('buyer-contact');
  if (nameEl && contactEl) {
    const name = nameEl.value.trim();
    const contact = contactEl.value.trim();
    if (!name || !contact) {
      showToast('닉네임과 연락처를 입력해주세요');
      (name ? contactEl : nameEl).focus();
      return null;
    }
    saveBuyer(name, contact);
    editingBuyer = false;
  }
  const p = getBuyer();
  if (!p.name || !p.contact) {
    editBuyer();
    showToast('닉네임과 연락처를 입력해주세요');
    return null;
  }
  return { buyer_token: p.token, buyer_name: p.name, buyer_contact: p.contact };
}

// ---------------------------------------------------------------------------
// 시간 표시 (서버는 UTC 'YYYY-MM-DD HH:MM:SS'로 내려준다)
// ---------------------------------------------------------------------------
function parseUtc(s) {
  return new Date(s.replace(' ', 'T') + 'Z');
}

function formatRemaining(ms) {
  if (ms <= 0) return '마감';
  const total = Math.floor(ms / 1000);
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (d > 0) return `${d}일 ${h}시간 남음`;
  if (h > 0) return `${h}시간 ${m}분 남음`;
  return `${m}분 ${String(s).padStart(2, '0')}초 남음`;
}

function countdownHtml(endAt) {
  return `<span class="countdown" data-end="${escapeAttr(endAt)}">${formatRemaining(parseUtc(endAt) - Date.now())}</span>`;
}

function tickCountdowns() {
  const now = Date.now();
  document.querySelectorAll('.countdown[data-end]').forEach(el => {
    const left = parseUtc(el.dataset.end) - now;
    el.textContent = formatRemaining(left);
    el.classList.toggle('urgent', left > 0 && left < 3 * 60 * 1000);
  });
}
setInterval(tickCountdowns, 1000);

function won(n) {
  return `${Number(n).toLocaleString('ko-KR')}원`;
}

// ---------------------------------------------------------------------------
// 필터
// ---------------------------------------------------------------------------
async function loadCategoryFilters() {
  try {
    const res = await fetch('/api/categories');
    const categories = await res.json();
    categoryFilterSlot.innerHTML = categories.map(c =>
      `<span class="tag selectable" data-value="${escapeAttr(c.name)}">${c.icon} ${escapeHtml(c.name)}</span>`
    ).join('');
  } catch (err) {
    categoryFilterSlot.innerHTML = '';
  }
  bindFilterTags();
}

function bindFilterTags() {
  const allTags = document.querySelectorAll('#filter-row .tag[data-value]');
  allTags.forEach(tag => {
    tag.classList.toggle('active', tag.dataset.value === currentCategory);
    tag.addEventListener('click', () => {
      allTags.forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      currentCategory = tag.dataset.value;
      loadItems();
    });
  });
}

function setLikedOnly(on) {
  likedOnly = on;
  likedOnlyToggle.classList.toggle('active', on);
  likedOnlyToggle.textContent = on ? '♥ 찜한 것만' : '♡ 찜한 것만';
}

likedOnlyToggle.addEventListener('click', () => {
  setLikedOnly(!likedOnly);
  if (likedOnly) setMyActivity(false);
  loadItems();
});

function setMyActivity(on) {
  myActivity = on;
  myActivityToggle.classList.toggle('active', on);
}

myActivityToggle.addEventListener('click', () => {
  setMyActivity(!myActivity);
  if (myActivity) setLikedOnly(false);
  loadItems();
});

// ---------------------------------------------------------------------------
// 목록
// ---------------------------------------------------------------------------
let currentItems = [];

async function loadItems() {
  const listEl = document.getElementById('item-list');
  listEl.innerHTML = '<div class="empty-state">불러오는 중...</div>';

  let url;
  if (myActivity) {
    url = `/api/buyers/${encodeURIComponent(getBuyer().token)}/activity`;
  } else {
    // 예약중·판매완료 상품도 목록에 남긴다 (구매/입찰 버튼만 막음). 유찰된 경매는 제외
    const params = new URLSearchParams({ status: 'available,reserved,sold_out' });
    if (currentCategory !== '전체') params.set('category', currentCategory);
    url = `/api/items?${params}`;
  }

  try {
    const res = await fetch(url);
    let items = await res.json();

    if (myActivity && currentCategory !== '전체') {
      items = items.filter(item => item.category === currentCategory);
    }
    if (likedOnly) {
      items = items.filter(item => likedItems.has(item.id));
    }
    currentItems = items;

    if (items.length === 0) {
      if (myActivity) {
        listEl.innerHTML = '<div class="empty-state">아직 입찰하거나 구매한 상품이 없어요.<br>🔨 경매 상품에 입찰해보세요</div>';
      } else {
        listEl.innerHTML = likedOnly
          ? '<div class="empty-state">아직 찜한 상품이 없어요.<br>마음에 드는 물건에 하트를 눌러보세요 🤍</div>'
          : '<div class="empty-state">아직 등록된 상품이 없어요.<br>곧 새로운 물건이 올라올 거예요 👀</div>';
      }
      return;
    }

    listEl.innerHTML = items.map(renderItem).join('');

    document.querySelectorAll('.item-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('.like-btn')) return;
        openDetail(card.dataset.id);
      });
    });

    document.querySelectorAll('.like-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLike(btn.dataset.id, btn);
      });
    });
  } catch (err) {
    listEl.innerHTML = '<div class="empty-state">불러오지 못했어요. 새로고침 해주세요.</div>';
  }
}

const MY_STATE_LABEL = {
  leading: ['good', '최고 입찰 중'],
  outbid: ['bad', '추월당했어요 · 다시 입찰 가능'],
  won: ['good', '🎉 낙찰 · 셀러에게 연락하세요'],
  bought: ['good', '✅ 구매 확정 · 셀러에게 연락하세요'],
  lost: ['done', '마감 · 낙찰 실패'],
};

function renderItem(item) {
  const liked = likedItems.has(item.id);
  const isAuction = item.sale_type === 'auction';
  const soldBadge = item.status === 'sold_out' ? '<span class="sold-badge">판매완료</span>' : '';
  const reservedBadge = item.status === 'reserved' ? '<span class="sold-badge reserved">예약중</span>' : '';
  const isClosed = item.status === 'reserved' || item.status === 'sold_out';
  // 긴 제목의 말줄임에 배지가 잘리지 않도록 제목 앞에 둔다
  const auctionBadge = isAuction ? '<span class="auction-badge">경매</span>' : '';
  const booth = item.booth_number ? escapeHtml(item.booth_number) + '번 부스' : '';

  // 1줄: 가격(굵게) / 2줄: 보조 정보(회색)
  let priceLine;
  const metaParts = [];
  if (isAuction && item.auction_open) {
    priceLine = `<span class="price-label">${item.bid_count ? '현재가' : '시작가'}</span>${won(item.display_price)}`;
    metaParts.push(`입찰 ${item.bid_count}`, countdownHtml(item.auction_end_at));
  } else if (isAuction) {
    priceLine = item.bid_count
      ? `<span class="price-label">최종</span>${won(item.display_price)}`
      : '<span class="price-label">유찰</span>';
    if (booth) metaParts.push(booth);
  } else {
    priceLine = won(item.display_price);
    if (booth) metaParts.push(booth);
  }
  const meta = metaParts.join(' · ');

  let pill = '';
  if (item.my_state && MY_STATE_LABEL[item.my_state]) {
    const [cls, text] = MY_STATE_LABEL[item.my_state];
    const extra = item.my_state === 'outbid' || item.my_state === 'leading'
      ? ` (내 최고 ${won(item.my_max_bid)})` : '';
    pill = `<span class="state-pill ${cls}">${text}${extra}</span>`;
  }

  return `
    <div class="item-card${isClosed ? ' is-closed' : ''}" data-id="${escapeAttr(item.id)}">
      <img class="item-thumb" src="${escapeAttr(item.image_path)}" alt="${escapeAttr(item.title)}" />
      <div class="item-info">
        <p class="title">${auctionBadge}<span class="title-text">${escapeHtml(item.title)}</span>${soldBadge}${reservedBadge}</p>
        <p class="price">${priceLine}</p>
        ${meta ? `<p class="meta">${meta}</p>` : ''}
        ${pill}
      </div>
      <button class="like-btn ${liked ? 'liked' : ''}" data-id="${escapeAttr(item.id)}" aria-label="찜하기">${liked ? '♥' : '♡'}</button>
    </div>
  `;
}

async function toggleLike(itemId, btn) {
  const isLiked = likedItems.has(itemId);
  const newLiked = !isLiked;

  try {
    await fetch(`/api/items/${itemId}/like`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ liked: newLiked })
    });
    if (newLiked) {
      likedItems.add(itemId);
      btn.classList.add('liked');
      btn.textContent = '♥';
    } else {
      likedItems.delete(itemId);
      btn.classList.remove('liked');
      btn.textContent = '♡';
      if (likedOnly) {
        btn.closest('.item-card').remove();
        if (document.querySelectorAll('#item-list .item-card').length === 0) {
          document.getElementById('item-list').innerHTML =
            '<div class="empty-state">아직 찜한 상품이 없어요.<br>마음에 드는 물건에 하트를 눌러보세요 🤍</div>';
        }
      }
    }
    localStorage.setItem('liked_items', JSON.stringify([...likedItems]));
  } catch (err) {
    showToast('찜하기 실패');
  }
}

// ---------------------------------------------------------------------------
// 상세 모달
// ---------------------------------------------------------------------------
let detailItem = null;
let pollTimer = null;
let actionsRenderedFor = null; // 경매 입력폼을 매 폴링마다 다시 그리면 입력값이 날아가므로 한 번만 그린다

function contactButtonHtml(item, label) {
  if (item.contact_link) {
    return `<a href="https://instagram.com/${encodeURIComponent(item.contact_link)}" target="_blank" rel="noopener" style="text-decoration:none;">
        <button class="btn-primary btn-block">💬 ${label || '셀러에게 연락하기'}</button>
      </a>`;
  }
  return `<p style="text-align:center; color:var(--muted); font-size:13px;">${item.booth_number ? escapeHtml(item.booth_number) + '번 부스에서 직접 만나보세요' : '현장에서 셀러를 찾아주세요'}</p>`;
}

function openDetail(itemId) {
  const item = currentItems.find(i => i.id === itemId);
  if (!item) return;
  detailItem = item;
  actionsRenderedFor = null;
  editingBuyer = false;

  const content = document.getElementById('modal-content');
  content.classList.remove('closed-view');
  content.innerHTML = `
    <div class="detail-media">
      <img class="detail-image" src="${escapeAttr(item.image_path)}" alt="${escapeAttr(item.title)}" />
      <div class="stamp" id="detail-stamp" aria-hidden="true"></div>
    </div>
    <div class="detail-title">
      <h3>${escapeHtml(item.title)}</h3>
      ${item.sale_type === 'auction' ? '<span class="auction-badge">경매</span>' : ''}
    </div>
    <p class="detail-seller">
      ${escapeHtml(item.seller_name)}${item.booth_number ? ' · ' + escapeHtml(item.booth_number) + '번 부스' : ''}
    </p>
    ${item.description ? `<p class="detail-desc">${escapeHtml(item.description)}</p>` : ''}
    <div id="detail-body"></div>
    <div id="detail-contact"></div>
  `;
  content.scrollTop = 0;
  document.getElementById('modal').style.display = 'flex';
  document.body.style.overflow = 'hidden'; // 뒤 페이지가 같이 스크롤되지 않게

  if (item.sale_type === 'auction') {
    document.getElementById('detail-body').innerHTML = `
      <div class="price-panel" id="auction-panel"><div class="sub">불러오는 중...</div></div>
      <div id="auction-status"></div>
      <div id="auction-actions"></div>
      <p class="section-title" style="margin-top:14px;">입찰 기록</p>
      <ul class="bid-history" id="bid-history"></ul>
    `;
    refreshAuction();
    pollTimer = setInterval(refreshAuction, 5000);
  } else {
    renderFixedDetail(item);
  }
}

/**
 * 예약중·판매완료 상품을 흐리게 하고 도장을 찍는다.
 * 내가 예약(즉시구매)했거나 낙찰받은 상품이면 찍지 않는다.
 * '내 것인지' 확인이 끝난 뒤에 호출하므로, 남의 상품에선 도장이 '쾅' 찍히는 애니메이션처럼 보인다.
 */
function applyClosedLook(item, isMine) {
  const content = document.getElementById('modal-content');
  const stamp = document.getElementById('detail-stamp');
  if (!content || !stamp) return;
  const closed = item.status === 'reserved' || item.status === 'sold_out';
  const show = closed && !isMine;
  content.classList.toggle('closed-view', show);
  if (!show) {
    stamp.className = 'stamp';
    stamp.textContent = '';
    return;
  }
  const label = item.status === 'sold_out' ? '판매완료' : '예약중';
  if (stamp.textContent === label) return; // 폴링마다 다시 찍지 않게
  stamp.textContent = label;
  stamp.className = `stamp ${item.status === 'sold_out' ? 'sold' : 'reserved'} show`;
}

/** 예약중·판매완료 상품 안내 (본인이 산 상품이 아닌 경우) */
function closedNoticeHtml(item) {
  const auctionWon = item.sale_type === 'auction' && item.bid_count;
  if (item.status === 'sold_out') {
    return `<div class="closed-notice">🔒 판매가 완료된 상품이에요.</div>`;
  }
  if (item.status === 'reserved') {
    return `<div class="closed-notice">🔒 ${auctionWon ? '경매가 끝나 다른 분께 낙찰됐어요' : '다른 분과 거래가 진행 중인 예약 상품이에요'}.<br><span>구매·입찰은 할 수 없어요.</span></div>`;
  }
  return `<div class="closed-notice">지금은 구매할 수 없는 상품이에요.</div>`;
}

// ---- 고정가 상품 ----
function renderFixedDetail(item) {
  const body = document.getElementById('detail-body');
  const contact = document.getElementById('detail-contact');
  let html = `
    <div class="price-panel">
      <div class="row"><span style="font-size:12px; color:var(--muted);">판매가</span></div>
      <div class="big">${won(item.display_price)}</div>
    </div>`;

  if (item.my_state === 'bought') {
    html += `<div class="result-box">✅ 구매가 확정된 상품이에요. 셀러에게 연락해서 거래를 마무리해주세요.</div>`;
    contact.innerHTML = contactButtonHtml(item);
  } else if (item.buy_now_available) {
    html += `<div id="buyer-slot">${buyerBoxHtml()}</div>
      <button class="btn-primary btn-block" id="buy-now-btn" onclick="submitBuyNow()">⚡ ${won(item.display_price)}에 즉시구매</button>`;
    contact.innerHTML = contactButtonHtml(item, '구매 전에 셀러에게 문의하기').replace('btn-primary', 'btn-outline');
  } else {
    html += `<div id="closed-slot">${closedNoticeHtml(item)}</div>`;
    checkMyPurchase(item); // 내가 산 상품이면 안내를 '구매 확정'으로 교체
  }
  body.innerHTML = html;
}

async function checkMyPurchase(item) {
  try {
    const res = await fetch(`/api/items/${encodeURIComponent(item.id)}/bids?buyer_token=${encodeURIComponent(getBuyer().token)}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (!detailItem || detailItem.id !== item.id) return; // 그 사이 다른 상품으로 바뀜
    applyClosedLook(item, data.i_won);
    if (!data.i_won) return;
    const slot = document.getElementById('closed-slot');
    if (slot) slot.innerHTML = `<div class="result-box">✅ 내가 구매한 상품이에요. 셀러에게 연락해서 거래를 마무리해주세요.</div>`;
    document.getElementById('detail-contact').innerHTML = contactButtonHtml(item);
  } catch (err) {
    // 확인 실패 시엔 '내 것 아님'으로 보고 일반 안내 + 도장
    if (detailItem && detailItem.id === item.id) applyClosedLook(item, false);
  }
}

// ---- 경매 상품 ----
async function refreshAuction() {
  if (!detailItem) return;
  const itemId = detailItem.id;
  let data;
  try {
    const res = await fetch(`/api/items/${encodeURIComponent(itemId)}/bids?buyer_token=${encodeURIComponent(getBuyer().token)}`);
    if (!res.ok) throw new Error();
    data = await res.json();
  } catch (err) {
    return; // 일시적 네트워크 오류는 다음 폴링에서 복구
  }
  if (!detailItem || detailItem.id !== itemId) return; // 그 사이 모달이 닫히거나 바뀜

  const item = data.item;
  detailItem = { ...detailItem, ...item };

  // 가격 패널
  document.getElementById('auction-panel').innerHTML = `
    <div class="row">
      <span style="font-size:12px; color:var(--muted);">${item.bid_count ? (item.auction_open ? '현재가' : '최종가') : '시작가'}</span>
      ${item.auction_open ? countdownHtml(item.auction_end_at) : '<span style="font-size:12px; color:var(--muted);">마감</span>'}
    </div>
    <div class="big">${won(item.display_price)}</div>
    <div class="sub">입찰 ${item.bid_count}회${item.bid_count ? ' · 시작가 ' + won(item.price) : ''}${item.buy_now_available ? ' · 즉시구매가 ' + won(item.buy_now_price) : ''}</div>
  `;

  // 내 상태
  const statusEl = document.getElementById('auction-status');
  const contactEl = document.getElementById('detail-contact');
  applyClosedLook(item, data.i_won);
  if (data.i_won) {
    statusEl.innerHTML = `<div class="result-box">🎉 낙찰됐어요! 셀러에게 연락해서 거래를 마무리해주세요. 내 연락처도 셀러에게 전달됐어요.</div>`;
    contactEl.innerHTML = contactButtonHtml(item);
  } else if (!item.auction_open) {
    statusEl.innerHTML = item.bid_count
      ? closedNoticeHtml(item)
      : `<div class="closed-notice">입찰 없이 마감됐어요.</div>`;
    contactEl.innerHTML = '';
  } else if (data.i_am_highest) {
    statusEl.innerHTML = `<p style="margin:0 0 12px;"><span class="state-pill good">현재 최고 입찰자예요</span></p>`;
  } else if (data.bids.some(b => b.is_mine)) {
    statusEl.innerHTML = `<p style="margin:0 0 12px;"><span class="state-pill bad">다른 분이 더 높게 입찰했어요</span></p>`;
  } else {
    statusEl.innerHTML = '';
  }

  // 입찰 폼 (진행 중일 때만, 한 번만 그림)
  const actionsEl = document.getElementById('auction-actions');
  if (!item.auction_open) {
    actionsEl.innerHTML = '';
    actionsRenderedFor = null;
  } else {
    if (actionsRenderedFor !== itemId) {
      actionsEl.innerHTML = `
        <div id="buyer-slot">${buyerBoxHtml()}</div>
        <label>입찰 금액 (원)</label>
        <div class="bid-row">
          <input type="text" inputmode="numeric" id="bid-amount" oninput="formatPriceInput(this)" />
          <button class="btn-primary" id="bid-btn" onclick="submitBid()">입찰</button>
        </div>
        <p class="field-hint" id="bid-hint" style="margin:6px 0 0;"></p>
        <div class="quick-raise" id="quick-raise"></div>
        <div id="buy-now-slot"></div>
      `;
      actionsRenderedFor = itemId;
    }
    const amountEl = document.getElementById('bid-amount');
    const typed = Number(amountEl.value.replace(/[^\d]/g, ''));
    if (document.activeElement !== amountEl && typed < item.min_next_bid) {
      amountEl.value = Number(item.min_next_bid).toLocaleString('ko-KR');
    }
    document.getElementById('bid-hint').textContent = `최소 ${won(item.min_next_bid)}부터 입찰할 수 있어요 · 입찰은 취소할 수 없어요`;
    const steps = [0, 1, 2].map(k => item.min_next_bid + k * minIncrement(item.min_next_bid));
    document.getElementById('quick-raise').innerHTML = steps.map(v =>
      `<button type="button" onclick="setBidAmount(${v})">${won(v)}</button>`).join('');
    document.getElementById('buy-now-slot').innerHTML = item.buy_now_available
      ? `<button class="btn-outline btn-block" id="buy-now-btn" onclick="submitBuyNow()">⚡ ${won(item.buy_now_price)}에 즉시구매</button>`
      : '';
  }

  // 입찰 기록
  document.getElementById('bid-history').innerHTML = data.bids.length
    ? data.bids.map(b => `
        <li class="${b.is_mine ? 'mine' : ''}">
          <span>${escapeHtml(b.bidder)}${b.is_mine ? ' (나)' : ''}<span class="when">${formatClock(b.created_at)}</span></span>
          <span>${won(b.amount)}</span>
        </li>`).join('')
    : '<li style="color:var(--muted); justify-content:center;">아직 입찰이 없어요. 첫 입찰자가 되어보세요</li>';

  tickCountdowns();
}

/** 서버의 최소 입찰 단위와 같은 규칙 (빠른 금액 버튼용 — 최종 검증은 서버가 함) */
function minIncrement(price) {
  if (price < 10000) return 500;
  if (price < 50000) return 1000;
  if (price < 100000) return 2000;
  return 5000;
}

function setBidAmount(v) {
  document.getElementById('bid-amount').value = Number(v).toLocaleString('ko-KR');
}

function formatClock(utc) {
  const d = parseUtc(utc);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function formatPriceInput(el) {
  const digits = el.value.replace(/[^\d]/g, '');
  el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
}

async function readError(res, fallback) {
  const body = await res.json().catch(() => ({}));
  return typeof body.detail === 'string' ? body.detail : fallback;
}

async function submitBid() {
  const buyer = collectBuyer();
  if (!buyer) return;
  const amount = Number(document.getElementById('bid-amount').value.replace(/[^\d]/g, ''));
  if (!amount) {
    showToast('입찰 금액을 입력해주세요');
    return;
  }
  if (!confirm(`${won(amount)}에 입찰할까요?\n입찰은 취소할 수 없어요.`)) return;

  const btn = document.getElementById('bid-btn');
  btn.disabled = true;
  try {
    const res = await fetch(`/api/items/${encodeURIComponent(detailItem.id)}/bids`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...buyer, amount })
    });
    if (!res.ok) {
      showToast(await readError(res, '입찰하지 못했어요'));
    } else {
      const body = await res.json();
      showToast(body.extended ? '입찰 완료! 마감 직전이라 3분 연장됐어요' : '입찰 완료!');
      document.getElementById('bid-amount').value = '';
      document.getElementById('buyer-slot').innerHTML = buyerBoxHtml();
    }
  } catch (err) {
    showToast('네트워크 오류가 발생했어요');
  } finally {
    btn.disabled = false;
    refreshAuction();
  }
}

async function submitBuyNow() {
  const buyer = collectBuyer();
  if (!buyer) return;
  const item = detailItem;
  const price = item.sale_type === 'auction' ? item.buy_now_price : item.display_price;
  if (!confirm(`${won(price)}에 즉시구매할까요?\n확정되면 셀러에게 내 연락처가 전달되고, 거래는 셀러와 직접 진행해요.`)) return;

  const btn = document.getElementById('buy-now-btn');
  if (btn) btn.disabled = true;
  try {
    const res = await fetch(`/api/items/${encodeURIComponent(item.id)}/buy-now`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buyer)
    });
    if (!res.ok) {
      showToast(await readError(res, '구매하지 못했어요'));
      if (btn) btn.disabled = false;
      if (item.sale_type === 'auction') refreshAuction();
      return;
    }
    stopPolling();
    document.getElementById('detail-body').innerHTML = `
      <div class="price-panel">
        <div class="row"><span style="font-size:12px; color:var(--muted);">구매가</span></div>
        <div class="big">${won(price)}</div>
      </div>
      <div class="result-box">✅ 구매가 확정됐어요! 셀러에게 연락해서 거래를 마무리해주세요.<br>내 연락처(${escapeHtml(buyer.buyer_contact)})도 셀러에게 전달됐어요.</div>
    `;
    document.getElementById('detail-contact').innerHTML = contactButtonHtml(item);
    loadItems();
  } catch (err) {
    showToast('네트워크 오류가 발생했어요');
    if (btn) btn.disabled = false;
  }
}

function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

function closeDetail() {
  const wasAuction = detailItem && detailItem.sale_type === 'auction';
  stopPolling();
  detailItem = null;
  actionsRenderedFor = null;
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = '';
  if (wasAuction) loadItems(); // 현재가/입찰 수 갱신
}

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeDetail();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('modal').style.display !== 'none') closeDetail();
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

if (likedOnly) {
  setLikedOnly(true);
}

loadCategoryFilters();
loadItems();
</script>
</body>
